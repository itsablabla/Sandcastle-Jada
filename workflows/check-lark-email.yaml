name: check-lark-email
description: >
  List recent mailbox messages synced into Twenty CRM (Lark / connected email).
  Uses the Twenty API bearer (same token as mcpServers.twenty at
  https://crm.garza.online/mcp). Fails closed when TWENTY_CRM_API_TOKEN is unset.
default_model: sonnet
default_timeout: 180

input_schema:
  properties:
    last_check_iso:
      type: string
      description: >
        ISO-8601 timestamp of last successful check (e.g. 2026-07-20T00:00:00Z).
        Messages with receivedAt less than or equal to this are ignored. Empty = all.
      default: ""
    limit:
      type: integer
      description: Max messages to fetch from Twenty (fixed at 50 in URL for now)
      default: 50

steps:
  # Deterministic REST call. Auth is server env TWENTY_CRM_API_TOKEN (Twenty MCP bearer).
  # Bare env auth raises before the request if the variable is missing.
  - id: list-messages
    type: http
    http_config:
      method: GET
      url: "https://crm.garza.online/rest/messages?limit=50"
      auth: TWENTY_CRM_API_TOKEN
      headers:
        Accept: "application/json"
      fail_on_error: true
    retry:
      max_attempts: 2
      backoff: exponential

  # Restricted sandbox: no imports. Assign to result only.
  - id: filter-new
    type: code
    depends_on: [list-messages]
    code_config:
      language: python
      code: |
        body = _steps.get("list-messages", {})
        if not isinstance(body, dict):
            body = {"raw": body}

        messages = []
        data = body.get("data")
        if isinstance(data, dict):
            messages = data.get("messages") or data.get("records") or []
        elif isinstance(data, list):
            messages = data
        if not messages and isinstance(body.get("messages"), list):
            messages = body["messages"]
        if not isinstance(messages, list):
            messages = []

        last_check = str(_input.get("last_check_iso") or "").strip()

        new_msgs = []
        newest = last_check
        for msg in messages:
            if not isinstance(msg, dict):
                continue
            received = str(msg.get("receivedAt") or msg.get("createdAt") or "")
            if last_check and received and received <= last_check:
                continue
            if received and (not newest or received > newest):
                newest = received
            text = str(msg.get("text") or msg.get("body") or msg.get("snippet") or "")
            new_msgs.append({
                "id": msg.get("id"),
                "thread_id": msg.get("messageThreadId") or msg.get("message_thread_id"),
                "subject": msg.get("subject") or "",
                "received_at_iso": received,
                "snippet": text[:200],
                "is_draft": msg.get("isDraft"),
                "header_message_id": msg.get("headerMessageId"),
            })

        empty_sync = len(messages) == 0
        if empty_sync:
            summary = (
                "Twenty workspace returned 0 messages. Connect Lark/email in Twenty "
                "and wait for sync if this stays empty."
            )
        elif len(new_msgs) == 0:
            summary = "No new emails since last check."
        else:
            lines = []
            for m in new_msgs:
                lines.append(
                    "- [" + str(m.get("received_at_iso") or "") + "] "
                    + str(m.get("subject") or "") + " — "
                    + str(m.get("snippet") or "")
                )
            summary = "New emails:\n" + "\n".join(lines)

        result = {
            "source": "twenty-crm",
            "endpoint": "https://crm.garza.online/rest/messages",
            "http_status": body.get("status_code"),
            "last_check_iso": last_check,
            "fetched_count": len(messages),
            "new_count": len(new_msgs),
            "new_last_check_iso": newest if new_msgs else last_check,
            "messages": new_msgs,
            "total_count": body.get("totalCount"),
            "note": (
                "Twenty workspace returned 0 messages. Connect Lark/email in Twenty "
                "and wait for sync if this stays empty."
                if empty_sync
                else None
            ),
            "summary": summary,
        }

  - id: report
    type: llm
    depends_on: [filter-new]
    prompt: |
      Summarize this mailbox check for an operator. Be concise.
      Source is Twenty CRM (Lark/email sync via crm.garza.online). Call out empty inbox vs API errors.
      Data:
      {steps.filter-new.output}
